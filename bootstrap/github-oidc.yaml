AWSTemplateFormatVersion: "2010-09-09"
Description: >
  One-time bootstrap so GitHub Actions can deploy aws-automated-ec2-forensics into
  this account without long-lived access keys (GitHub OIDC federation), plus an S3
  bucket for Terraform state. Deploy from the CloudFormation console or with:
  aws cloudformation deploy --template-file bootstrap/github-oidc.yaml --stack-name ec2-forensics-github-oidc
    --capabilities CAPABILITY_NAMED_IAM --parameter-overrides GitHubOwner=<you> RepositoryName=aws-automated-ec2-forensics

Parameters:
  GitHubOwner:
    Type: String
    Description: GitHub user or organisation that owns the repository.
  RepositoryName:
    Type: String
    Default: aws-automated-ec2-forensics
  CreateOIDCProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if token.actions.githubusercontent.com is already an IAM identity provider in this account.
  DeployPolicyArn:
    Type: String
    Default: arn:aws:iam::aws:policy/AdministratorAccess
    Description: >
      Policy for the deploy role. AdministratorAccess keeps the lab simple because the stack creates IAM roles.
      In production use a scoped policy plus a permissions boundary.

Conditions:
  CreateProvider: !Equals [!Ref CreateOIDCProvider, "true"]

Resources:
  GitHubOIDCProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${RepositoryName}-github-deploy"
      MaxSessionDuration: 7200
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Sub "arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com"
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub "repo:${GitHubOwner}/${RepositoryName}:ref:refs/heads/main"
                  - !Sub "repo:${GitHubOwner}/${RepositoryName}:environment:aws-lab"
      ManagedPolicyArns:
        - !Ref DeployPolicyArn

  StateBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketName: !Sub "${RepositoryName}-tfstate-${AWS::AccountId}"
      VersioningConfiguration:
        Status: Enabled
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced

  StateBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref StateBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: DenyInsecureTransport
            Effect: Deny
            Principal: "*"
            Action: s3:*
            Resource:
              - !GetAtt StateBucket.Arn
              - !Sub "${StateBucket.Arn}/*"
            Condition:
              Bool:
                aws:SecureTransport: "false"

Outputs:
  DeployRoleArn:
    Description: Save as the GitHub repository variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  StateBucketName:
    Description: Save as the GitHub repository variable TF_STATE_BUCKET
    Value: !Ref StateBucket
