name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    name: Lambda unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3 pytest
      - run: python -m pytest -q tests/

  terraform:
    name: Terraform fmt / validate / test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: terraform fmt
        id: fmt
        continue-on-error: true
        run: terraform fmt -check -recursive -diff
      - run: terraform init -backend=false -input=false
      - run: terraform validate
      - name: terraform test (mocked AWS provider, no credentials)
        run: terraform test
      - name: validate member-account module
        working-directory: terraform/modules/member-account-role
        run: terraform init -backend=false -input=false && terraform validate
      - name: Fail if formatting is off
        if: steps.fmt.outcome == 'failure'
        run: echo "::error::Run terraform fmt -recursive" && exit 1

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck -S warning scripts/*.sh src/workstation/*.sh src/test-target/*.sh

  checkov:
    name: Checkov IaC security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install checkov
      - name: checkov
        run: checkov --config-file .checkov.yaml
