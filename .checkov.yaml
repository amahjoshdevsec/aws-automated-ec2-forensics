# Checkov configuration. Each skip is a deliberate, documented design decision.
directory:
  - terraform
framework:
  - terraform
compact: true
quiet: true
soft-fail: true  # findings are reported in the job log; skips below are documented decisions
skip-check:
  # Lambdas call only AWS APIs; putting them in a VPC adds NAT/endpoint cost without reducing risk here.
  - CKV_AWS_117
  # Orchestration Lambdas are invoked synchronously by Step Functions, which owns retries/catches (no async DLQ).
  - CKV_AWS_116
  # Account-level concurrency is left to the account; reserved concurrency breaks on new accounts (limit 10).
  - CKV_AWS_115
  # Code signing is recommended for production (see README), not required for the lab.
  - CKV_AWS_272
  # Evidence bucket: access logging and cross-region replication are production add-ons (see README).
  - CKV_AWS_18
  - CKV_AWS_144
  # Event notifications on the evidence bucket are not needed; the workflow notifies via SNS.
  - CKV2_AWS_62
  # The workstation has a public IP for egress only (no inbound rules); private-subnet mode is documented.
  - CKV_AWS_88
  # API Gateway approval endpoint uses single-use 256-bit links; Cognito/IAM auth is a documented production option.
  - CKV_AWS_309
  # The IAM policy statements with "*" resources are Describe*/tracing/logging calls that do not support resource scoping.
  - CKV_AWS_356
  - CKV_AWS_111
  # Member account module grants EC2 isolation actions that cannot be resource-scoped in advance.
  - CKV_AWS_290
  - CKV_AWS_355
  # Customer managed key policies must use "*" as the resource (it refers to the key itself).
  - CKV_AWS_109
  # SNS/Step Functions/X-Ray defaults are acceptable; state machine logging level is ERROR to avoid storing tokens.
  - CKV2_AWS_64
  # Security group has only egress rules; description exists at group and rule level.
  - CKV_AWS_382
